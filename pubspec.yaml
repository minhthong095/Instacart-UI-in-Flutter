name: tangerine
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.5

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.3.0
  vector_graphics: ^1.2.4
  flutter_bloc: ^9.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  vector_graphics_compiler: ^1.3.2

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - lib/page/store_filter_by_service/logos/
    - lib/page/store/member_logo.png
    - lib/page/store/kirkland_logo.png
    - lib/page/dashboard/logos/
    - lib/page/cart/target_logo.png
    - lib/page/cart/wegmans_logo.png
    - asset/grocery.svg.vec
    - asset/restaurant.svg.vec
    - asset/glass.svg.vec
    - asset/snack.svg.vec
    - asset/gift.svg.vec
    - mock/stores.jsonl
    - mock/store_carousels.jsonl
    - mock/store_aisles+subs+categories_products.jsonl
    - mock/store_categories_products.jsonl
    - mock/product full data/products/

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  fonts:
    - family: ATCInstacartOneshotSaver
      fonts:
        - asset: asset/fonts/ATCInstacartOneshotSaver-Regular.otf
          weight: 400
        - asset: asset/fonts/ATCInstacartOneshotSaver-Bold.otf
          weight: 700
    - family: InstacartSansBody
      fonts:
        - asset: asset/fonts/InstacartSansBody-Regular.otf
          weight: 400
        - asset: asset/fonts/InstacartSansBody-Medium.otf
          weight: 500
        - asset: asset/fonts/InstacartSansBody-Bold.otf
          weight: 700
    - family: InstacartSansHeadline
      fonts:
        - asset: asset/fonts/InstacartSansHeadline-Regular.otf
          weight: 400
        - asset: asset/fonts/InstacartSansHeadline-Medium.otf
          weight: 500
        - asset: asset/fonts/InstacartSansHeadline-Bold.otf
          weight: 700
    - family: InstacartSerifHeadline
      fonts:
        - asset: asset/fonts/InstacartSerifHeadline-Regular.otf
          weight: 400
        - asset: asset/fonts/InstacartSerifHeadline-Medium.otf
          weight: 500
        - asset: asset/fonts/InstacartSerifHeadline-Bold.otf
          weight: 700
    - family: Instacart_Contrast_Text
      fonts:
        - asset: asset/fonts/Instacart_Contrast_Text-Regular.otf
          weight: 400
        - asset: asset/fonts/Instacart_Contrast_Text-SemiBold.otf
          weight: 600
        - asset: asset/fonts/Instacart_Contrast_Text-Bold.otf
          weight: 700
        - asset: asset/fonts/Instacart_Contrast_Text-ExtraBold.otf
          weight: 800
    - family: Instacart_Sans_Subhead
      fonts:
        - asset: asset/fonts/Instacart_Sans_Subhead-Regular.otf
          weight: 400
        - asset: asset/fonts/Instacart_Sans_Subhead-SemiBold.otf
          weight: 600
        - asset: asset/fonts/Instacart_Sans_Subhead-Bold.otf
          weight: 700
        - asset: asset/fonts/Instacart_Sans_Subhead-ExtraBold.otf
          weight: 800
    - family: Instacart_Sans_Text
      fonts:
        - asset: asset/fonts/Instacart_Sans_Text-Regular.otf
          weight: 400
        - asset: asset/fonts/Instacart_Sans_Text-Regular_Italic.otf
          weight: 400
          style: italic
        - asset: asset/fonts/Instacart_Sans_Text-SemiBold.otf
          weight: 600
        - asset: asset/fonts/Instacart_Sans_Text-SemiBold_Italic.otf
          weight: 600
          style: italic
        - asset: asset/fonts/Instacart_Sans_Text-Bold.otf
          weight: 700
        - asset: asset/fonts/Instacart_Sans_Text-Bold_Italic.otf
          weight: 700
          style: italic
        - asset: asset/fonts/Instacart_Sans_Text-ExtraBold.otf
          weight: 800
        - asset: asset/fonts/Instacart_Sans_Text-ExtraBold_Italic.otf
          weight: 800
          style: italic
    - family: Roboto
      fonts:
        - asset: asset/fonts/Roboto-Bold.ttf
          weight: 700
